name: Publish

on:
  push:
    branches: [ release ]
    paths-ignore:
    - 'doc/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for NuGet trusted publishing (OIDC)
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Install dependencies
      run: dotnet restore IF.Lastfm.sln
    - name: Build
      run: dotnet build -c Release --no-restore IF.Lastfm.sln
    - name: Test
      run: dotnet test --no-restore IF.Lastfm.sln
    - name: Pack
      run: dotnet pack -c Release --no-build --include-source -o ./tmp IF.Lastfm.sln
    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      run: dotnet nuget push ./tmp/Lastream.Lastfm*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        path: ./tmp/*nupkg
